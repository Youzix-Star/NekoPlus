name: Android CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AGP 9 and the Kotlin 2.4 toolchain both target JDK 21.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # This action only has to fetch cmdline-tools and export ANDROID_HOME. Its default
      # `packages: tools platform-tools` is not usable any more: the SDK repository no longer
      # carries the legacy `tools` package, and `sdkmanager` exits 1 on it ("Failed to find
      # package 'tools'"), which failed the whole job before anything was even built. The next
      # step installs exactly what the build needs.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::KEYSTORE_BASE64 is not set, the release APK will be unsigned."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/miao-release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/miao-release.jks" >> "$GITHUB_ENV"

      # The rule language is a parser and an engine: the things that fail silently. Run its tests
      # before spending a release build on the APK. AGP 9 only creates unit test tasks for
      # debuggable variants, and these tests are pure Kotlin — the variant changes nothing.
      - name: Test the rule engine
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      # A test task that found no tests is still a "successful" build, which is the one way a green
      # CI can mean nothing at all. Count them.
      - name: Check tests actually ran
        run: |
          shopt -s nullglob
          files=(app/build/test-results/testDebugUnitTest/*.xml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::the unit test task produced no results at all"
            exit 1
          fi
          total=0
          for f in "${files[@]}"; do
            n=$(sed -n 's/.*tests="\([0-9]*\)".*/\1/p' "$f" | head -1)
            echo "$(basename "$f"): ${n:-0} tests"
            total=$((total + ${n:-0}))
          done
          echo "total: $total tests"
          test "$total" -gt 0

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: List build outputs
        run: ls -l app/build/outputs/apk/release/

      # A release asset called `app-release.apk` tells the user nothing; the ref (a tag on
      # release builds) does.
      - name: Name the APK after the ref
        run: |
          mkdir -p dist
          for apk in app/build/outputs/apk/release/*.apk; do
            cp "$apk" "dist/MiaoAssistant-${GITHUB_REF_NAME}.apk"
          done
          ls -l dist/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiaoAssistant-release-apk
          path: dist/*.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: MiaoAssistant-release-apk
          path: apk

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
          generate_release_notes: true
          draft: false
