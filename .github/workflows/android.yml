name: Android CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    # Pinned on purpose: `ubuntu-latest` migrates to Ubuntu 26 on 2026-10-19, and an
    # unpinned build is not a build you can reproduce. Bump this deliberately.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # AGP 9 and the Kotlin 2.4 toolchain both target JDK 21.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # This action only has to fetch cmdline-tools and export ANDROID_HOME; the next step installs
      # exactly what the build needs. It used to default to `packages: tools platform-tools`, and the
      # SDK repository no longer carries the legacy `tools` package — `sdkmanager` exited 1 on it and
      # failed the job before anything was built. v4 defaults to platform-tools, so no override.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The guide's fan.miuix:* dependencies come from HyperCeiler's GitHub Packages, which needs a
      # token even though those packages are public. PACKAGES_TOKEN is a PAT with read:packages;
      # without it the job's own token is tried, and if that is refused the build says so plainly.
      - name: Expose the packages token to Gradle
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "GIT_ACTOR=${{ github.actor }}" >> "$GITHUB_ENV"
          if [ -z "${PACKAGES_TOKEN:-}" ]; then
            echo "::warning::no token available for GitHub Packages; fan.miuix:* will not resolve"
          else
            echo "GIT_TOKEN=$PACKAGES_TOKEN" >> "$GITHUB_ENV"
          fi

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::KEYSTORE_BASE64 is not set, the release APK will be unsigned."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/miao-release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/miao-release.jks" >> "$GITHUB_ENV"

      # The rule language is a parser and an engine: the things that fail silently. Run its tests
      # before spending a release build on the APK. AGP 9 only creates unit test tasks for
      # debuggable variants, and these tests are pure Kotlin — the variant changes nothing.
      - name: Test the rule engine
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      # A test task that found no tests is still a "successful" build, which is the one way a green
      # CI can mean nothing at all. Count them.
      - name: Check tests actually ran
        run: |
          shopt -s nullglob
          files=(app/build/test-results/testDebugUnitTest/*.xml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::the unit test task produced no results at all"
            exit 1
          fi
          total=0
          for f in "${files[@]}"; do
            n=$(sed -n 's/.*tests="\([0-9]*\)".*/\1/p' "$f" | head -1)
            echo "$(basename "$f"): ${n:-0} tests"
            total=$((total + ${n:-0}))
          done
          echo "total: $total tests"
          test "$total" -gt 0

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: List build outputs
        run: ls -l app/build/outputs/apk/release/

      # A release asset called `app-release.apk` tells the user nothing; the ref (a tag on
      # release builds) does.
      - name: Name the APK after the ref
        run: |
          # A pull request's ref name is not a branch name: it is "1/merge", and the slash turns the
          # destination into a directory that does not exist ("dist/MiaoAssistant-1/merge.apk"), so
          # every PR run died here after a perfectly good build. Sanitise it before using it as a
          # file name.
          SAFE_REF="${GITHUB_REF_NAME//\//-}"
          mkdir -p dist
          for apk in app/build/outputs/apk/release/*.apk; do
            cp "$apk" "dist/MiaoAssistant-${SAFE_REF}.apk"
          done
          ls -l dist/

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: MiaoAssistant-release-apk
          path: dist/*.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    # Pinned on purpose: `ubuntu-latest` migrates to Ubuntu 26 on 2026-10-19, and an
    # unpinned build is not a build you can reproduce. Bump this deliberately.
    runs-on: ubuntu-24.04
    steps:
      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: MiaoAssistant-release-apk
          path: apk

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: apk/*.apk
          generate_release_notes: true
          draft: false
